name: Daily Intelligence Pipeline Run
run-name: Daily Briefing Pipeline (${{ github.event.inputs.domain || 'manufacturing' }})

on:
  schedule:
    # 02:00 UTC daily execution
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      domain:
        description: "Target domain identifier"
        required: true
        default: "manufacturing"
      sync_to_cloud:
        description: "Synchronize report to Cloudflare Worker API"
        type: boolean
        required: true
        default: false
      dispatch_email:
        description: "Dispatch email to active subscribers"
        type: boolean
        required: true
        default: false

jobs:
  run-pipeline:
    name: Execute Daily Python Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Run Daily Intelligence Pipeline
        env:
          SIGNALBRIEF_API_URL: ${{ secrets.SIGNALBRIEF_API_URL || 'https://signalbrief-worker.workers.dev' }}
          SIGNALBRIEF_INTERNAL_KEY: ${{ secrets.SIGNALBRIEF_INTERNAL_KEY }}
          SIGNALBRIEF_DISPATCH_EMAIL: ${{ github.event.inputs.dispatch_email || 'false' }}
        run: |
          DOMAIN="${{ github.event.inputs.domain || 'manufacturing' }}"
          SYNC_FLAG=""
          if [ "${{ github.event.inputs.sync_to_cloud }}" = "true" ] || [ -n "${{ secrets.SIGNALBRIEF_INTERNAL_KEY }}" ]; then
            SYNC_FLAG="--sync"
          fi
          EMAIL_FLAG=""
          if [ "${{ github.event.inputs.dispatch_email }}" = "true" ]; then
            EMAIL_FLAG="--dispatch-email"
          fi
          
          python scripts/run_daily_brief.py --domain "$DOMAIN" $SYNC_FLAG $EMAIL_FLAG

      - name: Upload Generated Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-reports-${{ github.run_id }}
          path: |
            reports/generated/
            reports/previews/
          retention-days: 14
