name: Daily Intelligence Pipeline Run
run-name: Daily Briefing Pipeline (${{ github.event.inputs.domain || 'manufacturing' }})

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      domain:
        description: "Target domain identifier"
        required: true
        default: "manufacturing"
      sync_to_cloud:
        description: "Synchronize report to Cloudflare Worker API"
        type: boolean
        required: true
        default: false
      dispatch_email:
        description: "Dispatch email to active subscribers"
        type: boolean
        required: true
        default: false
      job_id:
        description: "Pipeline job ID (for user-triggered runs - set by Worker)"
        required: false
        default: ""
      job_token:
        description: "Pipeline job callback token (for authenticated status callbacks)"
        required: false
        default: ""
      worker_api_url:
        description: "Cloudflare Worker base URL (for job callbacks)"
        required: false
        default: ""

jobs:
  run-pipeline:
    name: Execute Daily Python Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Mask Sensitive Tokens
        run: |
          if [ -n "${{ github.event.inputs.job_token }}" ]; then
            echo "::add-mask::${{ github.event.inputs.job_token }}"
          fi

      - name: Mark Job as RUNNING (callback to Worker)
        if: ${{ github.event.inputs.job_id != '' && github.event.inputs.worker_api_url != '' }}
        env:
          JOB_TOKEN: ${{ github.event.inputs.job_token }}
        run: |
          curl -s -X POST \
            "${{ github.event.inputs.worker_api_url }}/api/jobs/${{ github.event.inputs.job_id }}/callback" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${JOB_TOKEN}" \
            -d '{"status":"running"}' || echo "Callback failed (non-fatal)"

      - name: Run Daily Intelligence Pipeline
        id: pipeline
        env:
          SIGNALBRIEF_API_URL: ${{ secrets.SIGNALBRIEF_API_URL || vars.SIGNALBRIEF_API_URL || github.event.inputs.worker_api_url || 'https://signalbrief-worker.workers.dev' }}
          SIGNALBRIEF_INTERNAL_KEY: ${{ secrets.SIGNALBRIEF_INTERNAL_KEY }}
          SIGNALBRIEF_DISPATCH_EMAIL: ${{ github.event.inputs.dispatch_email || 'false' }}
          PIPELINE_JOB_ID: ${{ github.event.inputs.job_id }}
          PIPELINE_JOB_TOKEN: ${{ github.event.inputs.job_token }}
          PIPELINE_WORKER_URL: ${{ github.event.inputs.worker_api_url || secrets.SIGNALBRIEF_API_URL || vars.SIGNALBRIEF_API_URL || '' }}
        run: |
          DOMAIN="${{ github.event.inputs.domain || 'manufacturing' }}"
          SYNC_FLAG=""
          if [ "${{ github.event.inputs.sync_to_cloud }}" = "true" ] || [ -n "${{ secrets.SIGNALBRIEF_INTERNAL_KEY }}" ]; then
            SYNC_FLAG="--sync"
          fi
          EMAIL_FLAG=""
          if [ "${{ github.event.inputs.dispatch_email }}" = "true" ]; then
            EMAIL_FLAG="--dispatch-email"
          fi
          JOB_FLAGS=""
          if [ -n "${{ github.event.inputs.job_id }}" ]; then
            JOB_FLAGS="--job-id ${{ github.event.inputs.job_id }}"
          fi
          WORKER_URL_FLAG=""
          if [ -n "${PIPELINE_WORKER_URL}" ]; then
            WORKER_URL_FLAG="--worker-url ${PIPELINE_WORKER_URL}"
          fi

          python scripts/run_daily_brief.py \
            --domain "$DOMAIN" \
            $SYNC_FLAG \
            $EMAIL_FLAG \
            $JOB_FLAGS \
            $WORKER_URL_FLAG

      - name: Upload Generated Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-reports-${{ github.run_id }}
          path: |
            reports/generated/
            reports/previews/
          retention-days: 14
