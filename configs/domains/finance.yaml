domain:
  id: finance
  name: Financial Technology & Markets
  description: >
    Monitor macro trends, fintech innovations, payment systems,
    central bank policies, and financial regulation.

  keywords:
    - central bank digital currency
    - interest rates
    - payment infrastructure
    - treasury operations
    - credit markets
    - fintech regulation
    - algorithmic trading
    - venture funding

  subtopics:
    - monetary policy
    - cross-border payments
    - retail banking
    - capital expenditure
    - risk modeling

  excluded_keywords:
    - get rich quick
    - casino gaming
    - lottery

  report:
    max_developments: 5
    include_sentiment: true
    include_trends: true
